<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海大餐廳線上候位系統</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f2f5f9;
    margin: 0;
    padding: 20px;
    color: #263345;
}

.container {
    max-width: 500px;
    margin: 40px auto;
}

h1 {
    text-align: center;
    color: #24548f;
}

.subtitle {
    text-align: center;
    color: #666;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-top: 20px;
    box-shadow: 0 3px 12px #00000012;
}

.count {
    text-align: center;
    font-size: 24px;
    color: #24548f;
    font-weight: bold;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: #24548f;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #173d6b;
}

.notice {
    color: #666;
    font-size: 14px;
    text-align: center;
    line-height: 1.7;
}

#result {
    margin-top: 16px;
    text-align: center;
    color: #24548f;
}
</style>
</head>

<body>

<div class="container">

    <h1>海大餐廳線上候位系統</h1>
    <p class="subtitle">歡迎使用線上候位服務</p>

    <div class="card">
        <h2>目前候位狀況</h2>
        <p class="count" id="waitingCount">
            尚未連接後端
        </p>
        <p class="notice">
            系統完成後將自動更新候位資訊
        </p>
    </div>

    <div class="card">
        <h2>顧客候位登記</h2>

        <form id="waitlistForm">

            <label for="name">姓名</label>
            <input type="text" id="name"
                   required maxlength="30"
                   placeholder="請輸入姓名">

            <label for="gender">性別</label>
            <select id="gender" required>
                <option value="">請選擇</option>
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
            </select>

            <label for="email">E-mail</label>
            <input type="email" id="email"
                   required
                   placeholder="example@gmail.com">

            <label for="party_size">用餐人數</label>
            <input type="number" id="party_size"
                   min="1" max="20"
                   value="2" required>

            <button type="submit">
                取得候位號碼
            </button>
        </form>

        <div id="result" aria-live="polite"></div>
    </div>

    <p class="notice">
        海大餐廳候位系統<br>
        GitHub Pages + Google Apps Script
    </p>

</div>

<script>
// 改成自己的 Google Apps Script 部署網址
const API_URL =
  "https://script.google.com/macros/s/AKfycbxh7bp_ISPBtlQPnOhYQOMbQe_q8V2j_M-aLYfSpkgS8beWIudGZUf0VaG_Gfb9cPJ32w/exec";

const form = document.getElementById("waitlistForm");
const result = document.getElementById("result");
const button = form.querySelector("button");

// 跨網域唯讀 JSONP 查詢
function jsonp(action, params = {}) {
  return new Promise((resolve, reject) => {
    const callback = "__wl_cb_" +
      Date.now() + "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");
    const url = new URL(API_URL);

    url.searchParams.set("action", action);
    url.searchParams.set("prefix", callback);

    for (const [key, value] of Object.entries(params)) {
      url.searchParams.set(key, value);
    }

    const cleanup = () => {
      clearTimeout(timer);
      delete window[callback];
      script.remove();
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("查詢逾時"));
    }, 10000);

    window[callback] = data => {
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error("無法連接後端"));
    };

    script.src = url.toString();
    document.body.appendChild(script);
  });
}

// 更新目前候位組數
async function refreshCount() {
  try {
    const data = await jsonp("count");
    document.getElementById("waitingCount")
      .textContent = data.waiting + " 組";
  } catch (err) {
    document.getElementById("waitingCount")
      .textContent = "暫時無法取得資料";
  }
}

// 每 5 秒自動更新
refreshCount();
setInterval(refreshCount, 5000);

// 產生隨機請求編號
function createToken() {
  if (crypto.randomUUID) {
    return crypto.randomUUID();
  }

  return Array.from(
    crypto.getRandomValues(new Uint8Array(16)),
    b => b.toString(16).padStart(2, "0")
  ).join("");
}

// 顯示候位號碼
function showTicket(data) {
  result.textContent =
    "登記成功！您的候位號碼：" + data.id +
    "，前面還有 " + data.ahead + " 組。";

  form.style.display = "none";
  refreshCount();
}

// 查詢是否已成功加入 Queue
async function checkTicket(token) {
  for (let i = 0; i < 15; i++) {
    try {
      const data = await jsonp("status", {
        request_id: token
      });

      if (data.found) return data;
    } catch (err) {
      console.warn(err);
    }

    await new Promise(r => setTimeout(r, 1500));
  }

  return null;
}

// 送出候位表單
form.addEventListener("submit", async event => {
  event.preventDefault();

  button.disabled = true;
  result.textContent = "正在登記候位，請勿重複送出...";

  let token = sessionStorage.getItem("waitlistToken");

  if (!token) {
    token = createToken();
    sessionStorage.setItem("waitlistToken", token);
  }

  const customer = {
    action: "join",
    request_id: token,
    name: document.getElementById("name").value,
    gender: document.getElementById("gender").value,
    email: document.getElementById("email").value,
    party_size: Number(
      document.getElementById("party_size").value
    )
  };

  try {
    // no-cors：傳送資料，但不直接讀取回應
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(customer)
    });

    // 另外查詢，確認資料真的進入 Queue
    const ticket = await checkTicket(token);

    if (ticket) {
      showTicket(ticket);
    } else {
      result.textContent =
        "暫時無法確認登記結果，請先勿重複登記。";
    }

  } catch (err) {
    result.textContent =
      "連線發生問題，請檢查網路後重試。";
  } finally {
    button.disabled = false;
  }
});

// 同一個瀏覽器分頁重新整理時，找回候位
const savedToken = sessionStorage.getItem("waitlistToken");

if (savedToken) {
  jsonp("status", { request_id: savedToken })
    .then(data => {
      if (data.found) showTicket(data);
    })
    .catch(console.warn);
}
</script>

</body>
</html>
