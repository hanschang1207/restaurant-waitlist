<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海大餐廳線上候位系統</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f2f5f9;
    margin: 0;
    padding: 20px;
    color: #263345;
}

.container {
    max-width: 500px;
    margin: 40px auto;
}

h1 {
    text-align: center;
    color: #24548f;
}

.subtitle {
    text-align: center;
    color: #666;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-top: 20px;
    box-shadow: 0 3px 12px #00000012;
}

.count {
    text-align: center;
    font-size: 24px;
    color: #24548f;
    font-weight: bold;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: #24548f;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #173d6b;
}

.notice {
    color: #666;
    font-size: 14px;
    text-align: center;
    line-height: 1.7;
}

#result {
    margin-top: 16px;
    text-align: center;
    color: #24548f;
}
</style>
</head>

<body>

<div class="container">

    <h1>海大餐廳線上候位系統</h1>
    <p class="subtitle">歡迎使用線上候位服務</p>

    <div class="card">
        <h2>目前候位狀況</h2>
        <p class="count" id="waitingCount">
            尚未連接後端
        </p>
        <p class="notice">
            系統完成後將自動更新候位資訊
        </p>
    </div>

    <div class="card">
        <h2>顧客候位登記</h2>

        <form id="waitlistForm">

            <label for="name">姓名</label>
            <input type="text" id="name"
                   required maxlength="30"
                   placeholder="請輸入姓名">

            <label for="gender">性別</label>
            <select id="gender" required>
                <option value="">請選擇</option>
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
            </select>

            <label for="email">E-mail</label>
            <input type="email" id="email"
                   required
                   placeholder="example@gmail.com">

            <label for="party_size">用餐人數</label>
            <input type="number" id="party_size"
                   min="1" max="20"
                   value="2" required>

            <button type="submit">
                取得候位號碼
            </button>
        </form>

        <div id="result" aria-live="polite"></div>
    </div>

    <p class="notice">
        海大餐廳候位系統<br>
        GitHub Pages + Google Apps Script
    </p>

</div>

<script>
const form = document.getElementById("waitlistForm");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("result").textContent =
        "表單檢查成功！下一步連接後端後，才能正式取得候位號碼。";
});
</script>

</body>
</html>
