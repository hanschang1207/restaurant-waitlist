<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>海大餐廳 - 員工管理</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f2f5f9;
    margin: 0;
    padding: 20px;
    color: #263345;
}

.container {
    max-width: 500px;
    margin: 80px auto;
}

h1 {
    text-align: center;
    color: #24548f;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 12px;
    margin-top: 20px;
    text-align: center;
    box-shadow: 0 3px 12px #00000012;
}

.button {
    display: block;
    background: #24548f;
    color: white;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 18px;
}

.button:hover {
    background: #173d6b;
}

.back {
    display: block;
    margin-top: 22px;
    color: #24548f;
}

.notice {
    font-size: 14px;
    color: #666;
    line-height: 1.7;
}
</style>
</head>

<body>

<div class="container">

    <h1>海大餐廳員工管理系統</h1>

    <div class="card">
        <h2>員工專用入口</h2>

        <p>請進入管理系統並輸入員工密碼。</p>

        <a class="button"
           href="https://script.google.com/macros/s/AKfycbxh7bp_ISPBtlQPnOhYQOMbQe_q8V2j_M-aLYfSpkgS8beWIudGZUf0VaG_Gfb9cPJ32w/exec?action=staff">
            前往員工登入
        </a>

        <p class="notice">
            員工登入與候位名單管理
            由 Google Apps Script 處理。
        </p>

        <a class="back" href="index.html">
            返回顧客候位頁面
        </a>
    </div>

</div>

</body>
</html>
